name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-major: ${{ steps.version.outputs.version-major-only }}
      version-minor: ${{ format('{0}.{1}', steps.version.outputs.version-major-only, steps.version.outputs.version-minor-only) }}
      version-patch: ${{ format('{0}.{1}.{2}', steps.version.outputs.version-major-only, steps.version.outputs.version-minor-only, steps.version.outputs.version-patch-only) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Generate next version
        id: version
        uses: conventional-actions/next-version@1b3e4803a0bdf7435ba7bb5ace077445ed54e82a # v1.1.8
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          always-auth: true
          registry-url: https://registry.npmjs.com/
          scope: ketch-sdk
          node-version: 20
          cache: "npm"
      - name: Setup Node version
        uses: conventional-actions/write-version@v1
        with:
          output_path: package.json
          version: ${{ format('{0}.{1}.{2}', steps.version.outputs.version-major-only, steps.version.outputs.version-minor-only, steps.version.outputs.version-patch-only) }}
      - name: Install dependencies
        run: npm ci
      - name: Run all targets
        run: npm run all
      - name: Publish
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Release
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: conventional-actions/create-release@c025b7306d14a25901b72486f97f3ebe7662a8ed # v1.0.31
        with:
          tag_name: ${{ needs.build.outputs.version }}
          artifacts: "*"

  bump-semaphore:
    name: Bump semaphore ketch-logging dependency
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout semaphore
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ketch-com/semaphore
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup npmrc for ketch-com
        uses: conventional-actions/setup-npmrc@1249e413feee16148d8bf9360166202ce428da82 # v1
        with:
          always-auth: true
          scope: ketch-com
          token: ${{ secrets.GH_TOKEN }}

      - name: Bump ketch-logging version
        run: npm pkg set dependencies.@ketch-sdk/ketch-logging="^${{ needs.build.outputs.version-patch }}"

      - name: Update package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Import GPG key
        uses: conventional-actions/import-gpg@e14bec88da3bf2dcb7949ee51dc6087630664928 # v1.0.2
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Create branch and commit
        run: |
          VERSION="${{ needs.build.outputs.version-patch }}"
          BRANCH="chore/bump-ketch-logging-${VERSION}"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore: bump ketch-logging to ${VERSION}"
          git push origin "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Close stale bump PRs
        run: |
          gh pr list \
            --repo ketch-com/semaphore \
            --search "chore: bump ketch-logging in:title" \
            --state open \
            --json number \
            --jq '.[].number' | \
          xargs -r -I {} gh pr close {} \
            --repo ketch-com/semaphore \
            --comment "Superseded by newer version bump"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create PR
        run: |
          VERSION="${{ needs.build.outputs.version-patch }}"
          gh pr create \
            --repo ketch-com/semaphore \
            --title "chore: bump ketch-logging to ${VERSION}" \
            --body "## Description of this change
          > Bumps ketch-logging to ${VERSION}

          ## Why is this change being made?
          - [x] Chore (non-functional changes)
          - [ ] Bug fix (non-breaking change that fixes an issue)
          - [ ] New feature (non-breaking change that adds functionality)
          - [ ] Breaking change (fix or feature that would cause existing functionality to not work as expected)

          ## How was this tested? How can the reviewer verify your testing?
          > Automated dependency bump

          ## Related issues

          ## Checklist
          - [ ] I have added tests to cover my changes.
          - [x] All new and existing tests passed.
          - [x] I have evaluated the security impact of this change, and [OWASP Secure Coding Practices](https://owasp.org/www-project-secure-coding-practices-quick-reference-guide/migrated_content#) have been observed.
          - [x] I have informed stakeholders of my changes." \
            --head "chore/bump-ketch-logging-${VERSION}" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
